<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobDock Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h2 class="brand">JobDock</h2>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="tracker">Tracker</button>
      <button class="tab-btn" data-tab="add">Add Contact</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </div>
  </header>

  <main>
    <!-- Tracker Tab -->
    <div id="tracker" class="tab-content active">
      <div id="contacts-container">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Add Contact Tab -->
    <div id="add" class="tab-content">
      <form id="add-contact-form" class="card-form">
        <label>Name
          <input type="text" id="contact-name" required placeholder="John Doe">
        </label>
        <label>Role
          <input type="text" id="contact-role" required placeholder="Engineering Manager">
        </label>
        <label>Company
          <input type="text" id="contact-company" required placeholder="Google">
        </label>
        <label>Channel
          <select id="contact-channel">
            <option value="LinkedIn">LinkedIn</option>
            <option value="Email">Email</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <label>Status
          <select id="contact-status">
            <option value="Sent">Sent (Waiting)</option>
            <option value="Follow-up due">Follow-up due</option>
            <option value="Replied">Replied</option>
            <option value="Closed">Closed</option>
            <option value="Dropped">Dropped</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary">Save Contact</button>
      </form>
    </div>

    <!-- Settings Tab -->
    <div id="settings" class="tab-content">
      <form id="settings-form" class="card-form">
        <label>LLM Provider (Phase 3)
          <select id="settings-provider">
            <option value="gemini">Google Gemini</option>
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic</option>
          </select>
        </label>
        <label>API Key
          <input type="password" id="settings-apikey" placeholder="Paste your API key here">
        </label>
        <label>Follow-up Interval (Days)
          <input type="number" id="settings-interval" min="1" max="14" value="3">
        </label>
        <label>Max Follow-ups Allowed
          <input type="number" id="settings-max" min="1" max="5" value="2">
        </label>
        <button type="submit" class="btn btn-primary">Save Settings</button>
      </form>
    </div>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
